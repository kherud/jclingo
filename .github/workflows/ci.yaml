# Runs the Java test suite against a freshly built clingo library on every platform that jclingo ships, plus a
# separate matrix covering the supported Java releases. The binding needs Java 22, where the foreign function API
# is final.

name: Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve clingo version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.clingo.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: clingo
        uses: ./.github/actions/clingo-version

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build-natives.yaml
    with:
      clingo-ref: ${{ needs.version.outputs.ref }}

  # Every published library is loaded on its own architecture, so a broken cross build cannot slip through.
  test-platforms:
    name: Test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86-64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: darwin-x86-64
            runner: macos-15-intel
          - target: darwin-aarch64
            runner: macos-15
          - target: win32-x86-64
            runner: windows-2025
          - target: win32-aarch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download library
        uses: actions/download-artifact@v8
        with:
          name: libclingo-${{ matrix.target }}
          path: src/main/resources

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '22'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-logs-${{ matrix.target }}
          path: |
            hs_err_pid*.log
            replay_pid*.log
            target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  # 22 is the release the foreign function API became final in and hence the oldest one this binding supports.
  test-java:
    name: Test Java ${{ matrix.java }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['22', '25']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download library
        uses: actions/download-artifact@v8
        with:
          name: libclingo-linux-x86-64
          path: src/main/resources

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test
