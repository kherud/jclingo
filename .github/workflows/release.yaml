# Builds the clingo library for every shipped platform, tests each one natively and publishes the JAR containing all
# of them to GitHub Packages and Maven Central.

name: Build clingo and publish JAR

on:
  workflow_dispatch:
    inputs:
      build-only:
        description: Build and test without publishing
        required: false
        default: false
        type: boolean
  release:
    types: [ created ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve clingo version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.clingo.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: clingo
        uses: ./.github/actions/clingo-version

      # A release published under a tag that does not match pom.xml would ship an artifact nobody can correlate with
      # the tag, so the run stops before anything is built.
      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          EXPECTED: v${{ steps.clingo.outputs.project-version }}
        run: |
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::release tag $TAG does not match the artifact version, expected $EXPECTED"
            exit 1
          fi

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build-natives.yaml
    with:
      clingo-ref: ${{ needs.version.outputs.ref }}

  test:
    name: Test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86-64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: darwin-x86-64
            runner: macos-15-intel
          - target: darwin-aarch64
            runner: macos-15
          - target: win32-x86-64
            runner: windows-2025
          - target: win32-aarch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download library
        uses: actions/download-artifact@v8
        with:
          name: libclingo-${{ matrix.target }}
          path: src/main/resources

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '22'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

  publish-github-packages:
    name: Publish to GitHub Packages
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build-only }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          pattern: libclingo-*
          merge-multiple: true
          path: src/main/resources

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '22'
          cache: maven

      - name: Publish package
        run: mvn --batch-mode --no-transfer-progress -P github deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven-central:
    name: Publish to Maven Central
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build-only }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          pattern: libclingo-*
          merge-multiple: true
          path: src/main/resources

      - name: Set up Maven Central repository
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '22'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish package
        run: mvn --batch-mode --no-transfer-progress -P central -Dgpg.keyname=${{ secrets.GPG_PRIMARY_KEYID }} deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASS }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
